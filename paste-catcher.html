<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Paste catcher</title>
<style>body{font-family:sans-serif;max-width:700px;margin:40px auto;padding:0 16px}textarea{width:100%;height:120px;font-size:16px}pre{background:#f0f0f0;padding:12px;white-space:pre-wrap;word-break:break-all;font-size:16px}button{font-size:16px;padding:10px 18px}</style>
</head>
<body>
<h1>Paste catcher</h1>
<p>Click in the box below, paste with Ctrl+V, then click Show pasted text. Nothing is sent anywhere, everything stays on this page.</p>
<textarea id="box" placeholder="Paste here"></textarea><br><br>
<button id="show">Show pasted text</button>
<pre id="out">(nothing pasted yet)</pre>
<script>
document.getElementById('show').addEventListener('click', function () {
  var v = document.getElementById('box').value;
  document.getElementById('out').textContent = v ? v : '(empty)';
});
document.getElementById('box').focus();
</script>
</body>
</html>
